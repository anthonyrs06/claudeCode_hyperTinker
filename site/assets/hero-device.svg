<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Body metallic gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4654"/>
      <stop offset="15%" stop-color="#5e6e80"/>
      <stop offset="50%" stop-color="#1d2530"/>
      <stop offset="85%" stop-color="#2a3340"/>
      <stop offset="100%" stop-color="#0c1118"/>
    </linearGradient>
    <linearGradient id="bodyHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#9bb3c9" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- End caps -->
    <radialGradient id="endCap" cx="0.35" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#7d8b9b"/>
      <stop offset="60%" stop-color="#2a3340"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <radialGradient id="heatVent" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="30%" stop-color="#ff7a2e"/>
      <stop offset="70%" stop-color="#9c2c00"/>
      <stop offset="100%" stop-color="#1a0a05"/>
    </radialGradient>
    <!-- Glow effect for heating element -->
    <radialGradient id="heatGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb86b" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff7a2e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
    <!-- Display screen -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a141f"/>
      <stop offset="50%" stop-color="#04080d"/>
      <stop offset="100%" stop-color="#0a141f"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee0ff" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#5ee0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5ee0ff" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Clamp -->
    <linearGradient id="clampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d2dd"/>
      <stop offset="40%" stop-color="#7d8b9b"/>
      <stop offset="100%" stop-color="#2a3340"/>
    </linearGradient>
    <!-- Background blur -->
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#ff8a3a" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ff5500" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient warm glow behind device -->
  <ellipse cx="600" cy="380" rx="520" ry="180" fill="url(#bgGlow)"/>

  <!-- Drop shadow under device -->
  <ellipse cx="600" cy="540" rx="380" ry="22" fill="#000" opacity="0.45" filter="url(#glowFilter)"/>

  <!-- Mounting clamp arm (rear) -->
  <g transform="translate(600,340)">
    <path d="M -260 -10 Q -290 -50 -260 -90 L -240 -90 Q -260 -55 -240 -25 L -220 -10 Z" fill="url(#clampGrad)" stroke="#1a2230" stroke-width="1"/>
    <rect x="-262" y="-100" width="36" height="14" rx="3" fill="#9aa6b4" stroke="#1a2230" stroke-width="1"/>
    <rect x="-260" y="-98" width="32" height="3" rx="1" fill="#3a4654" opacity="0.7"/>
    <circle cx="-244" cy="-93" r="2" fill="#1a2230"/>
  </g>

  <!-- Main body (cylinder) -->
  <g filter="url(#softShadow)">
    <!-- Rear end cap -->
    <ellipse cx="260" cy="340" rx="22" ry="78" fill="url(#endCap)"/>
    <!-- Body -->
    <rect x="260" y="262" width="680" height="156" fill="url(#bodyGrad)"/>
    <!-- Top highlight band -->
    <rect x="260" y="262" width="680" height="60" fill="url(#bodyHighlight)" opacity="0.7"/>
    <!-- Subtle horizontal panel line -->
    <line x1="260" y1="312" x2="940" y2="312" stroke="#0a0f15" stroke-width="0.6" opacity="0.6"/>
    <line x1="260" y1="378" x2="940" y2="378" stroke="#0a0f15" stroke-width="0.6" opacity="0.6"/>
    <!-- Front nose cone -->
    <path d="M 940 262 Q 1020 262 1060 340 Q 1020 418 940 418 Z" fill="url(#bodyGrad)"/>
    <path d="M 940 262 Q 1020 262 1060 340 L 1060 340 Q 1020 295 940 295 Z" fill="url(#bodyHighlight)" opacity="0.55"/>
    <!-- Front end intake ring -->
    <ellipse cx="1058" cy="340" rx="6" ry="24" fill="#0a1118"/>
    <ellipse cx="1056" cy="340" rx="4" ry="20" fill="#1d2530"/>
  </g>

  <!-- Heating element grille (front face panel) -->
  <g transform="translate(920,340)">
    <rect x="-10" y="-60" width="20" height="120" rx="4" fill="#0c121a" stroke="#0a0f15" stroke-width="0.5"/>
    <g>
      <rect x="-7" y="-54" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="-44" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="-34" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="-24" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="-14" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="-4" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="6" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="16" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="26" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="36" width="14" height="3" rx="1" fill="url(#heatVent)"/>
      <rect x="-7" y="46" width="14" height="3" rx="1" fill="url(#heatVent)"/>
    </g>
  </g>

  <!-- Glow emanating from heat vent -->
  <ellipse cx="940" cy="340" rx="120" ry="85" fill="url(#heatGlow)" opacity="0.75"/>
  <ellipse cx="950" cy="340" rx="60" ry="50" fill="url(#heatGlow)" opacity="0.6"/>

  <!-- Mid-body display screen / control surface -->
  <g transform="translate(560,300)">
    <rect x="-90" y="-6" width="180" height="80" rx="10" fill="#0a0f15" stroke="#1d2530" stroke-width="1"/>
    <rect x="-84" y="0" width="168" height="68" rx="6" fill="url(#screen)"/>
    <rect x="-84" y="0" width="168" height="68" rx="6" fill="url(#screenGlow)"/>
    <!-- temp display -->
    <text x="0" y="38" text-anchor="middle" font-family="'SF Mono', 'Menlo', monospace" font-size="34" font-weight="700" fill="#9cf0ff" letter-spacing="2">102°F</text>
    <text x="0" y="58" text-anchor="middle" font-family="'SF Mono', 'Menlo', monospace" font-size="9" fill="#5ec8e0" letter-spacing="3">HEATING · ZONE 2</text>
    <!-- corner status LEDs -->
    <circle cx="-72" cy="10" r="2" fill="#5ee0ff"/>
    <circle cx="72" cy="10" r="2" fill="#ff7a2e"/>
  </g>

  <!-- Touch buttons strip -->
  <g transform="translate(560,395)">
    <rect x="-70" y="-8" width="140" height="14" rx="6" fill="#0a0f15" stroke="#1d2530" stroke-width="0.5"/>
    <circle cx="-40" cy="-1" r="3" fill="#3a4654"/>
    <circle cx="-12" cy="-1" r="3" fill="#3a4654"/>
    <circle cx="16" cy="-1" r="3" fill="#3a4654"/>
    <circle cx="44" cy="-1" r="3" fill="#5ee0ff"/>
  </g>

  <!-- AQUAEMBER logo etched on side -->
  <g transform="translate(740,400)">
    <text x="0" y="0" font-family="'Inter', 'Helvetica', sans-serif" font-size="11" font-weight="600" fill="#5e6e80" letter-spacing="6">AQUAEMBER</text>
    <text x="0" y="12" font-family="'Inter', 'Helvetica', sans-serif" font-size="6" fill="#3a4654" letter-spacing="3">MARINE THERMAL · M1</text>
  </g>

  <!-- Vent slits across body -->
  <g opacity="0.85">
    <line x1="380" y1="282" x2="420" y2="282" stroke="#070a10" stroke-width="1"/>
    <line x1="380" y1="287" x2="420" y2="287" stroke="#070a10" stroke-width="1"/>
    <line x1="380" y1="292" x2="420" y2="292" stroke="#070a10" stroke-width="1"/>

    <line x1="380" y1="397" x2="420" y2="397" stroke="#070a10" stroke-width="1"/>
    <line x1="380" y1="402" x2="420" y2="402" stroke="#070a10" stroke-width="1"/>
    <line x1="380" y1="407" x2="420" y2="407" stroke="#070a10" stroke-width="1"/>
  </g>

  <!-- Recessed seam ring near front -->
  <line x1="880" y1="262" x2="880" y2="418" stroke="#070a10" stroke-width="1" opacity="0.85"/>
  <line x1="882" y1="262" x2="882" y2="418" stroke="#5e6e80" stroke-width="0.4" opacity="0.6"/>

  <!-- Tether eyelet on rear cap -->
  <g transform="translate(244,340)">
    <circle cx="0" cy="0" r="9" fill="#1d2530" stroke="#070a10" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#0a0f15"/>
    <path d="M -2 -2 L 2 2" stroke="#5e6e80" stroke-width="0.6"/>
  </g>

  <!-- Specular highlight streak on top -->
  <path d="M 320 270 Q 600 252 920 268" stroke="#cfdbe6" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M 320 271 Q 600 255 920 270" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.5"/>

  <!-- Faint heat shimmer particles -->
  <g opacity="0.7">
    <circle cx="1000" cy="290" r="2" fill="#ffd28a"/>
    <circle cx="1020" cy="320" r="1.4" fill="#ffb86b"/>
    <circle cx="1040" cy="350" r="2.2" fill="#ff9a4d"/>
    <circle cx="1010" cy="380" r="1.6" fill="#ffd28a"/>
    <circle cx="990" cy="395" r="1.2" fill="#ffb86b"/>
  </g>
</svg>
