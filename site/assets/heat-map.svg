<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5d8"/>
      <stop offset="15%" stop-color="#ffd28a"/>
      <stop offset="35%" stop-color="#ff7a2e"/>
      <stop offset="60%" stop-color="#c75a3c"/>
      <stop offset="85%" stop-color="#5a3c5e"/>
      <stop offset="100%" stop-color="#0a1424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e3c60"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <pattern id="topdownWater" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <path d="M 0 50 Q 75 30 150 50 T 300 50" stroke="#1e6fa0" stroke-width="0.6" fill="none" opacity="0.6"/>
      <path d="M 0 130 Q 75 110 150 130 T 300 130" stroke="#1e6fa0" stroke-width="0.5" fill="none" opacity="0.5"/>
      <path d="M 0 210 Q 75 190 150 210 T 300 210" stroke="#1e6fa0" stroke-width="0.6" fill="none" opacity="0.6"/>
      <path d="M 0 280 Q 75 260 150 280 T 300 280" stroke="#1e6fa0" stroke-width="0.5" fill="none" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Ocean background top-down -->
  <rect width="1000" height="700" fill="url(#ocean)"/>
  <rect width="1000" height="700" fill="url(#topdownWater)"/>

  <!-- Heat dispersion gradient -->
  <ellipse cx="500" cy="350" rx="420" ry="270" fill="url(#hot)"/>

  <!-- Concentric range bands with labels -->
  <g fill="none" stroke="#cfdbe6" stroke-width="0.6" opacity="0.5" stroke-dasharray="2,4">
    <ellipse cx="500" cy="350" rx="80" ry="55"/>
    <ellipse cx="500" cy="350" rx="180" ry="120"/>
    <ellipse cx="500" cy="350" rx="290" ry="190"/>
    <ellipse cx="500" cy="350" rx="400" ry="260"/>
  </g>

  <!-- Temperature markers -->
  <g font-family="'SF Mono', monospace" font-weight="600" fill="#0a0f15">
    <g transform="translate(500,300)">
      <rect x="-22" y="-12" width="44" height="20" rx="3" fill="#fff5d8" stroke="#ff5500" stroke-width="0.8"/>
      <text x="0" y="2" text-anchor="middle" font-size="11" fill="#9c2c00">104°F</text>
    </g>
    <g transform="translate(630,320)">
      <rect x="-22" y="-12" width="44" height="20" rx="3" fill="#ffd28a" stroke="#ff7a2e" stroke-width="0.8"/>
      <text x="0" y="2" text-anchor="middle" font-size="11" fill="#9c2c00">98°F</text>
    </g>
    <g transform="translate(760,360)">
      <rect x="-22" y="-12" width="44" height="20" rx="3" fill="#ff9a4d" stroke="#c75a3c" stroke-width="0.8"/>
      <text x="0" y="2" text-anchor="middle" font-size="11" fill="#fff">88°F</text>
    </g>
    <g transform="translate(870,400)">
      <rect x="-22" y="-12" width="44" height="20" rx="3" fill="#c75a3c" stroke="#5a3c5e" stroke-width="0.8"/>
      <text x="0" y="2" text-anchor="middle" font-size="11" fill="#fff">76°F</text>
    </g>
  </g>

  <!-- Distance markers (right side) -->
  <g font-family="'Inter', sans-serif" font-size="10" fill="#cfdbe6" opacity="0.85" text-anchor="start">
    <text x="585" y="455">3 ft</text>
    <text x="685" y="490">8 ft</text>
    <text x="800" y="525">15 ft</text>
    <text x="905" y="580">25 ft</text>
  </g>

  <!-- The device (top-down view, small in center) -->
  <g transform="translate(500,350)">
    <!-- glow halo -->
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="#ffd28a" opacity="0.4"/>
    <!-- body -->
    <rect x="-30" y="-7" width="50" height="14" rx="3" fill="#1d2530" stroke="#070a10" stroke-width="0.6"/>
    <rect x="-30" y="-7" width="50" height="6" rx="2" fill="#5e6e80" opacity="0.5"/>
    <!-- nose -->
    <path d="M 20 -7 Q 32 -7 36 0 Q 32 7 20 7 Z" fill="#1d2530" stroke="#070a10" stroke-width="0.6"/>
    <!-- vent glowing -->
    <rect x="32" y="-5" width="2" height="10" fill="#ff5500"/>
    <!-- top mini screen -->
    <rect x="-8" y="-3" width="14" height="6" rx="1" fill="#0a0f15"/>
    <rect x="-7" y="-2" width="12" height="4" fill="#5ee0ff" opacity="0.5"/>
  </g>

  <!-- Surrounding swimmer icons (silhouettes from above) -->
  <g fill="#0a0f15" opacity="0.85">
    <!-- swimmer 1 -->
    <g transform="translate(420,330)">
      <ellipse cx="0" cy="0" rx="10" ry="6"/>
      <ellipse cx="0" cy="-3" rx="4" ry="3" fill="#d8a878"/>
    </g>
    <!-- swimmer 2 -->
    <g transform="translate(580,400)">
      <ellipse cx="0" cy="0" rx="10" ry="6"/>
      <ellipse cx="0" cy="-3" rx="4" ry="3" fill="#d8a878"/>
    </g>
    <!-- swimmer 3 -->
    <g transform="translate(550,290)">
      <ellipse cx="0" cy="0" rx="10" ry="6"/>
      <ellipse cx="0" cy="-3" rx="4" ry="3" fill="#d8a878"/>
    </g>
  </g>

  <!-- Title and legend -->
  <g font-family="'Inter', sans-serif" fill="#cfdbe6">
    <text x="60" y="70" font-size="13" letter-spacing="6" fill="#5e6e80">THERMAL FOOTPRINT · TOP VIEW</text>
    <text x="60" y="105" font-size="32" font-weight="700" fill="#fff">A 25-foot bubble of comfort</text>
    <text x="60" y="135" font-size="14" fill="#9aa6b4">Sustained convective heating creates a stable warm zone around the unit,</text>
    <text x="60" y="154" font-size="14" fill="#9aa6b4">even in 60°F open water. Tested in coastal Maine, March.</text>
  </g>

  <!-- Color scale legend bottom -->
  <g transform="translate(60,620)">
    <text x="0" y="-8" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="3">WATER TEMP</text>
    <linearGradient id="legendGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e3c60"/>
      <stop offset="20%" stop-color="#5a3c5e"/>
      <stop offset="45%" stop-color="#c75a3c"/>
      <stop offset="75%" stop-color="#ff7a2e"/>
      <stop offset="100%" stop-color="#fff5d8"/>
    </linearGradient>
    <rect x="0" y="0" width="320" height="10" fill="url(#legendGrad)" rx="2"/>
    <g font-family="'SF Mono', monospace" font-size="9" fill="#9aa6b4">
      <text x="0" y="26">60°</text>
      <text x="78" y="26">75°</text>
      <text x="156" y="26">85°</text>
      <text x="234" y="26">95°</text>
      <text x="304" y="26">105°</text>
    </g>
  </g>
</svg>
