<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="exShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e6e80"/>
      <stop offset="50%" stop-color="#1d2530"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="exBattery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee0ff"/>
      <stop offset="100%" stop-color="#0e3c60"/>
    </linearGradient>
    <radialGradient id="exCoil" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="60%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#7a1a00"/>
    </radialGradient>
    <linearGradient id="clamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfdbe6"/>
      <stop offset="100%" stop-color="#3a4654"/>
    </linearGradient>
    <filter id="exShadow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- background subtle -->
  <rect width="1400" height="500" fill="#0a0f15"/>
  <g opacity="0.04" stroke="#5ee0ff" stroke-width="0.4">
    <line x1="0" y1="250" x2="1400" y2="250"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Dotted connector line through center -->
  <line x1="80" y1="250" x2="1320" y2="250" stroke="#5e6e80" stroke-width="0.6" stroke-dasharray="2,6" opacity="0.6"/>

  <!-- 1. Rear cap + tether ring -->
  <g transform="translate(150,250)">
    <ellipse cx="0" cy="40" rx="38" ry="6" fill="#000" opacity="0.4" filter="url(#exShadow)"/>
    <ellipse cx="0" cy="0" rx="14" ry="50" fill="url(#exShell)" stroke="#070a10" stroke-width="0.8"/>
    <circle cx="-14" cy="0" r="8" fill="#0a0f15" stroke="#5e6e80" stroke-width="0.6"/>
    <circle cx="-14" cy="0" r="4" fill="#070a10"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="2">END CAP</text>
    <text x="0" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#9aa6b4">+ tether ring</text>
  </g>

  <!-- 2. Battery pack -->
  <g transform="translate(360,250)">
    <ellipse cx="0" cy="60" rx="80" ry="6" fill="#000" opacity="0.4" filter="url(#exShadow)"/>
    <rect x="-65" y="-50" width="130" height="100" rx="6" fill="url(#exBattery)" stroke="#0a0f15" stroke-width="1"/>
    <g>
      <circle cx="-40" cy="-25" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="-40" cy="-25" r="3" fill="#5ee0ff"/>
      <circle cx="-10" cy="-25" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="-10" cy="-25" r="3" fill="#5ee0ff"/>
      <circle cx="20" cy="-25" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="20" cy="-25" r="3" fill="#5ee0ff"/>
      <circle cx="50" cy="-25" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="50" cy="-25" r="3" fill="#5ee0ff"/>
      <circle cx="-40" cy="5" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="-40" cy="5" r="3" fill="#5ee0ff"/>
      <circle cx="-10" cy="5" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="-10" cy="5" r="3" fill="#5ee0ff"/>
      <circle cx="20" cy="5" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="20" cy="5" r="3" fill="#5ee0ff"/>
      <circle cx="50" cy="5" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="50" cy="5" r="3" fill="#5ee0ff"/>
      <circle cx="-40" cy="35" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="-40" cy="35" r="3" fill="#5ee0ff"/>
      <circle cx="-10" cy="35" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="-10" cy="35" r="3" fill="#5ee0ff"/>
      <circle cx="20" cy="35" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="20" cy="35" r="3" fill="#5ee0ff"/>
      <circle cx="50" cy="35" r="10" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.6"/>
      <circle cx="50" cy="35" r="3" fill="#5ee0ff"/>
    </g>
    <text x="0" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="2">POWER CORE</text>
    <text x="0" y="114" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#9aa6b4">1.2 kWh LiFePO₄</text>
  </g>

  <!-- 3. Control PCB -->
  <g transform="translate(620,250)">
    <ellipse cx="0" cy="60" rx="60" ry="6" fill="#000" opacity="0.4" filter="url(#exShadow)"/>
    <rect x="-50" y="-40" width="100" height="80" rx="3" fill="#2a5a3a" stroke="#0a2010" stroke-width="0.8"/>
    <g stroke="#ffd28a" stroke-width="0.4" fill="none" opacity="0.85">
      <path d="M -40 -28 L 0 -28 L 0 -10"/>
      <path d="M -40 -10 L -10 -10"/>
      <path d="M 20 -28 L 40 -28 L 40 0"/>
      <path d="M -10 10 L 20 10 L 20 30"/>
      <path d="M -40 25 L 40 25"/>
    </g>
    <rect x="-30" y="-15" width="22" height="14" fill="#1a1410" stroke="#5e6e80" stroke-width="0.3"/>
    <text x="-19" y="-5" text-anchor="middle" font-family="monospace" font-size="5" fill="#5ee0ff">MCU</text>
    <rect x="5" y="-15" width="35" height="20" fill="#1a1410" stroke="#5e6e80" stroke-width="0.3"/>
    <text x="22" y="-2" text-anchor="middle" font-family="monospace" font-size="5" fill="#ff7a2e">IGBT</text>
    <circle cx="-30" cy="20" r="4" fill="#3a4654" stroke="#9aa6b4" stroke-width="0.3"/>
    <circle cx="-15" cy="20" r="4" fill="#3a4654" stroke="#9aa6b4" stroke-width="0.3"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="2">CONTROL BOARD</text>
    <text x="0" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#9aa6b4">MCU · BLE · sensors</text>
  </g>

  <!-- 4. Induction coil -->
  <g transform="translate(880,250)">
    <ellipse cx="0" cy="60" rx="70" ry="6" fill="#000" opacity="0.4" filter="url(#exShadow)"/>
    <ellipse cx="0" cy="0" rx="100" ry="40" fill="url(#exCoil)" opacity="0.3"/>
    <rect x="-60" y="-15" width="120" height="30" rx="4" fill="#3a2a1a" stroke="#1a1410" stroke-width="0.8"/>
    <g stroke="#ff7a2e" stroke-width="2.2" fill="none">
      <path d="M -55 -15 Q -47 -28 -40 -15"/>
      <path d="M -40 -15 Q -32 -28 -25 -15"/>
      <path d="M -25 -15 Q -17 -28 -10 -15"/>
      <path d="M -10 -15 Q -2 -28 5 -15"/>
      <path d="M 5 -15 Q 13 -28 20 -15"/>
      <path d="M 20 -15 Q 28 -28 35 -15"/>
      <path d="M 35 -15 Q 43 -28 50 -15"/>
    </g>
    <g stroke="#c75a3c" stroke-width="1.4" fill="none" opacity="0.7">
      <path d="M -55 15 Q -47 28 -40 15"/>
      <path d="M -40 15 Q -32 28 -25 15"/>
      <path d="M -25 15 Q -17 28 -10 15"/>
      <path d="M -10 15 Q -2 28 5 15"/>
      <path d="M 5 15 Q 13 28 20 15"/>
      <path d="M 20 15 Q 28 28 35 15"/>
      <path d="M 35 15 Q 43 28 50 15"/>
    </g>
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="2">INDUCTION COIL</text>
    <text x="0" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#9aa6b4">1.5 kW heating element</text>
  </g>

  <!-- 5. Front nose / flow manifold -->
  <g transform="translate(1100,250)">
    <ellipse cx="0" cy="60" rx="60" ry="6" fill="#000" opacity="0.4" filter="url(#exShadow)"/>
    <path d="M -30 -45 Q 30 -45 50 0 Q 30 45 -30 45 Z" fill="url(#exShell)" stroke="#070a10" stroke-width="0.8"/>
    <path d="M -30 -45 Q 30 -45 50 0 L 50 0 Q 30 -20 -30 -20 Z" fill="#5e6e80" opacity="0.4"/>
    <!-- vents -->
    <rect x="38" y="-25" width="6" height="50" rx="1" fill="#0a0f15"/>
    <rect x="39" y="-22" width="4" height="3" fill="#ff7a2e"/>
    <rect x="39" y="-15" width="4" height="3" fill="#ff7a2e"/>
    <rect x="39" y="-8" width="4" height="3" fill="#ff7a2e"/>
    <rect x="39" y="-1" width="4" height="3" fill="#ff7a2e"/>
    <rect x="39" y="6" width="4" height="3" fill="#ff7a2e"/>
    <rect x="39" y="13" width="4" height="3" fill="#ff7a2e"/>
    <rect x="39" y="20" width="4" height="3" fill="#ff7a2e"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="2">FLOW NOSE</text>
    <text x="0" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#9aa6b4">vortex outlet manifold</text>
  </g>

  <!-- 6. Clamp -->
  <g transform="translate(1290,250)">
    <ellipse cx="0" cy="60" rx="36" ry="6" fill="#000" opacity="0.4" filter="url(#exShadow)"/>
    <path d="M -20 -40 L 20 -40 L 20 0 Q 20 30 0 35 Q -20 30 -20 0 Z" fill="url(#clamp)" stroke="#070a10" stroke-width="0.6"/>
    <rect x="-22" y="-46" width="44" height="10" rx="2" fill="#9aa6b4" stroke="#1a2230" stroke-width="0.5"/>
    <circle cx="0" cy="-41" r="2" fill="#1a2230"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#5e6e80" letter-spacing="2">MOUNT CLAMP</text>
    <text x="0" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#9aa6b4">marine-anodized, universal fit</text>
  </g>

  <!-- Top title -->
  <text x="700" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#5e6e80" letter-spacing="8">EXPLODED VIEW · SIX CORE MODULES</text>
</svg>
