<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="shellOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e6e80"/>
      <stop offset="45%" stop-color="#1d2530"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="shellInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4654"/>
      <stop offset="100%" stop-color="#0a0f15"/>
    </linearGradient>
    <linearGradient id="battery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee0ff"/>
      <stop offset="50%" stop-color="#2e9bcc"/>
      <stop offset="100%" stop-color="#0e3c60"/>
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#7a1a00"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a3a"/>
      <stop offset="100%" stop-color="#0a2010"/>
    </linearGradient>
    <radialGradient id="coilGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb86b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background subtle grid -->
  <rect width="1400" height="600" fill="#0a0f15"/>
  <g opacity="0.06" stroke="#5ee0ff" stroke-width="0.4">
    <g id="grid">
      <line x1="0" y1="60" x2="1400" y2="60"/>
      <line x1="0" y1="120" x2="1400" y2="120"/>
      <line x1="0" y1="180" x2="1400" y2="180"/>
      <line x1="0" y1="240" x2="1400" y2="240"/>
      <line x1="0" y1="300" x2="1400" y2="300"/>
      <line x1="0" y1="360" x2="1400" y2="360"/>
      <line x1="0" y1="420" x2="1400" y2="420"/>
      <line x1="0" y1="480" x2="1400" y2="480"/>
      <line x1="0" y1="540" x2="1400" y2="540"/>
    </g>
  </g>

  <!-- Heat glow behind front section -->
  <ellipse cx="1080" cy="300" rx="240" ry="120" fill="url(#coilGlow)" opacity="0.5"/>

  <!-- ===== Cutaway device ===== -->
  <g transform="translate(200,300)">
    <!-- Outer shell upper half (closed) -->
    <path d="M 0 -65 L 900 -65 Q 970 -65 1010 0 L 0 0 Z" fill="url(#shellOuter)" stroke="#070a10" stroke-width="1"/>
    <!-- Lower half (cut open to expose interior) - draw thin shell at bottom -->
    <path d="M 0 65 L 900 65 Q 970 65 1010 0 L 0 0 Z" fill="url(#shellOuter)" opacity="0.18" stroke="#5e6e80" stroke-width="0.5" stroke-dasharray="3,2"/>
    <!-- Inner shell line -->
    <path d="M 5 -58 L 895 -58 Q 955 -58 990 -3" stroke="#3a4654" stroke-width="0.8" fill="none"/>

    <!-- Rear cap -->
    <ellipse cx="0" cy="0" rx="14" ry="65" fill="url(#shellInner)" stroke="#070a10" stroke-width="0.6"/>

    <!-- BATTERY PACK (rear third) -->
    <g transform="translate(80,0)">
      <rect x="0" y="-50" width="280" height="100" rx="6" fill="url(#battery)" stroke="#0a0f15" stroke-width="1"/>
      <!-- battery cells (cylindrical 18650-style cells visible) -->
      <g>
        <circle cx="30" cy="-30" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="30" cy="-30" r="10" fill="#1e6fa0"/>
        <circle cx="30" cy="-30" r="3" fill="#5ee0ff"/>
        <circle cx="70" cy="-30" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="70" cy="-30" r="10" fill="#1e6fa0"/>
        <circle cx="70" cy="-30" r="3" fill="#5ee0ff"/>
        <circle cx="110" cy="-30" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="110" cy="-30" r="10" fill="#1e6fa0"/>
        <circle cx="110" cy="-30" r="3" fill="#5ee0ff"/>
        <circle cx="150" cy="-30" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="150" cy="-30" r="10" fill="#1e6fa0"/>
        <circle cx="150" cy="-30" r="3" fill="#5ee0ff"/>
        <circle cx="190" cy="-30" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="190" cy="-30" r="10" fill="#1e6fa0"/>
        <circle cx="190" cy="-30" r="3" fill="#5ee0ff"/>
        <circle cx="230" cy="-30" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="230" cy="-30" r="10" fill="#1e6fa0"/>
        <circle cx="230" cy="-30" r="3" fill="#5ee0ff"/>
        <!-- second row -->
        <circle cx="30" cy="20" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="30" cy="20" r="10" fill="#1e6fa0"/>
        <circle cx="30" cy="20" r="3" fill="#5ee0ff"/>
        <circle cx="70" cy="20" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="70" cy="20" r="10" fill="#1e6fa0"/>
        <circle cx="70" cy="20" r="3" fill="#5ee0ff"/>
        <circle cx="110" cy="20" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="110" cy="20" r="10" fill="#1e6fa0"/>
        <circle cx="110" cy="20" r="3" fill="#5ee0ff"/>
        <circle cx="150" cy="20" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="150" cy="20" r="10" fill="#1e6fa0"/>
        <circle cx="150" cy="20" r="3" fill="#5ee0ff"/>
        <circle cx="190" cy="20" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="190" cy="20" r="10" fill="#1e6fa0"/>
        <circle cx="190" cy="20" r="3" fill="#5ee0ff"/>
        <circle cx="230" cy="20" r="14" fill="#0a1424" stroke="#5ee0ff" stroke-width="0.8"/>
        <circle cx="230" cy="20" r="10" fill="#1e6fa0"/>
        <circle cx="230" cy="20" r="3" fill="#5ee0ff"/>
      </g>
      <text x="140" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#5ee0ff" letter-spacing="2">1.2 kWh LiFePO₄</text>
    </g>

    <!-- Insulator bulkhead -->
    <rect x="372" y="-58" width="6" height="116" fill="#7d8b9b" opacity="0.6"/>

    <!-- PCB / control board (middle) -->
    <g transform="translate(385,0)">
      <rect x="0" y="-45" width="180" height="90" rx="2" fill="url(#pcb)" stroke="#0a2010" stroke-width="0.8"/>
      <!-- circuit traces -->
      <g stroke="#ffd28a" stroke-width="0.4" fill="none" opacity="0.85">
        <path d="M 10 -35 L 60 -35 L 60 -10"/>
        <path d="M 10 0 L 40 0 L 40 30 L 90 30"/>
        <path d="M 10 25 L 70 25"/>
        <path d="M 100 -35 L 170 -35"/>
        <path d="M 110 -10 L 110 30 L 170 30"/>
      </g>
      <!-- chips -->
      <rect x="20" y="-12" width="36" height="22" fill="#1a1410" stroke="#5e6e80" stroke-width="0.4"/>
      <text x="38" y="2" text-anchor="middle" font-family="monospace" font-size="5" fill="#5ee0ff">MCU</text>
      <rect x="70" y="-10" width="20" height="20" fill="#1a1410" stroke="#5e6e80" stroke-width="0.4"/>
      <rect x="115" y="-15" width="50" height="30" fill="#1a1410" stroke="#5e6e80" stroke-width="0.4"/>
      <text x="140" y="3" text-anchor="middle" font-family="monospace" font-size="5" fill="#ff7a2e">PWR · IGBT</text>
      <!-- capacitors -->
      <circle cx="30" cy="32" r="5" fill="#3a4654" stroke="#9aa6b4" stroke-width="0.4"/>
      <circle cx="50" cy="32" r="5" fill="#3a4654" stroke="#9aa6b4" stroke-width="0.4"/>
      <circle cx="70" cy="32" r="5" fill="#3a4654" stroke="#9aa6b4" stroke-width="0.4"/>
    </g>

    <!-- Screen / display unit (top of midsection viewed from inside) -->
    <g transform="translate(400,-58)">
      <rect x="0" y="-6" width="150" height="6" fill="#0a0f15" stroke="#1d2530" stroke-width="0.5"/>
      <rect x="2" y="-5" width="146" height="4" fill="#5ee0ff" opacity="0.4"/>
      <line x1="0" y1="0" x2="150" y2="0" stroke="#070a10" stroke-width="0.5"/>
    </g>

    <!-- Insulator -->
    <rect x="570" y="-58" width="6" height="116" fill="#7d8b9b" opacity="0.6"/>

    <!-- HEATING ELEMENT (front) - induction coil with copper windings -->
    <g transform="translate(700,0)">
      <!-- Glow behind coil -->
      <ellipse cx="0" cy="0" rx="180" ry="70" fill="url(#coilGlow)"/>
      <!-- ferrite core cylinder -->
      <rect x="-150" y="-25" width="300" height="50" rx="6" fill="#3a2a1a" stroke="#1a1410" stroke-width="1"/>
      <!-- Copper windings -->
      <g stroke="#ff7a2e" stroke-width="3" fill="none">
        <path d="M -140 -25 Q -130 -45 -120 -25"/>
        <path d="M -120 -25 Q -110 -45 -100 -25"/>
        <path d="M -100 -25 Q -90 -45 -80 -25"/>
        <path d="M -80 -25 Q -70 -45 -60 -25"/>
        <path d="M -60 -25 Q -50 -45 -40 -25"/>
        <path d="M -40 -25 Q -30 -45 -20 -25"/>
        <path d="M -20 -25 Q -10 -45 0 -25"/>
        <path d="M 0 -25 Q 10 -45 20 -25"/>
        <path d="M 20 -25 Q 30 -45 40 -25"/>
        <path d="M 40 -25 Q 50 -45 60 -25"/>
        <path d="M 60 -25 Q 70 -45 80 -25"/>
        <path d="M 80 -25 Q 90 -45 100 -25"/>
        <path d="M 100 -25 Q 110 -45 120 -25"/>
        <path d="M 120 -25 Q 130 -45 140 -25"/>
      </g>
      <g stroke="#c75a3c" stroke-width="2" fill="none" opacity="0.7">
        <path d="M -140 25 Q -130 45 -120 25"/>
        <path d="M -120 25 Q -110 45 -100 25"/>
        <path d="M -100 25 Q -90 45 -80 25"/>
        <path d="M -80 25 Q -70 45 -60 25"/>
        <path d="M -60 25 Q -50 45 -40 25"/>
        <path d="M -40 25 Q -30 45 -20 25"/>
        <path d="M -20 25 Q -10 45 0 25"/>
        <path d="M 0 25 Q 10 45 20 25"/>
        <path d="M 20 25 Q 30 45 40 25"/>
        <path d="M 40 25 Q 50 45 60 25"/>
        <path d="M 60 25 Q 70 45 80 25"/>
        <path d="M 80 25 Q 90 45 100 25"/>
        <path d="M 100 25 Q 110 45 120 25"/>
        <path d="M 120 25 Q 130 45 140 25"/>
      </g>
      <!-- glowing centerline -->
      <rect x="-150" y="-3" width="300" height="6" fill="url(#coil)"/>
    </g>

    <!-- Water intake channels in nose (water flows in, gets heated, flows out) -->
    <g transform="translate(900,0)">
      <path d="M 0 -50 Q 60 -50 100 -10 Q 60 -10 0 -10 Z" fill="#1a2840" opacity="0.6" stroke="#5ee0ff" stroke-width="0.5"/>
      <path d="M 0 50 Q 60 50 100 10 Q 60 10 0 10 Z" fill="#1a2840" opacity="0.6" stroke="#5ee0ff" stroke-width="0.5"/>
      <!-- water flow arrows -->
      <path d="M 20 -30 L 80 -30" stroke="#5ee0ff" stroke-width="1.2" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M 80 30 L 20 30" stroke="#ff7a2e" stroke-width="1.2" fill="none" marker-end="url(#arrowOrange)"/>
    </g>

    <!-- Nose contour -->
    <path d="M 900 -65 Q 970 -65 1010 0 Q 970 65 900 65" stroke="#070a10" stroke-width="0.8" fill="none"/>

    <!-- Tether eyelet -->
    <circle cx="-14" cy="0" r="6" fill="#0a0f15" stroke="#5e6e80" stroke-width="0.6"/>
    <circle cx="-14" cy="0" r="3" fill="#070a10"/>
  </g>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee0ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a2e"/>
    </marker>
  </defs>

  <!-- Labels -->
  <g font-family="'Inter', sans-serif" fill="#cfdbe6">
    <!-- Label: Battery -->
    <g>
      <line x1="300" y1="240" x2="300" y2="160" stroke="#5ee0ff" stroke-width="0.8"/>
      <circle cx="300" cy="240" r="3" fill="#5ee0ff"/>
      <text x="305" y="145" font-size="14" font-weight="600" fill="#5ee0ff">01 / POWER CORE</text>
      <text x="305" y="162" font-size="11" fill="#9aa6b4">1.2 kWh marine-grade LiFePO₄ pack</text>
      <text x="305" y="176" font-size="11" fill="#9aa6b4">— 12 cells, 8 hr typical runtime</text>
    </g>
    <!-- Label: Control board -->
    <g>
      <line x1="475" y1="350" x2="475" y2="450" stroke="#5ee0ff" stroke-width="0.8"/>
      <circle cx="475" cy="350" r="3" fill="#5ee0ff"/>
      <text x="480" y="470" font-size="14" font-weight="600" fill="#5ee0ff">02 / SMART CONTROL</text>
      <text x="480" y="487" font-size="11" fill="#9aa6b4">Adaptive PID thermal control,</text>
      <text x="480" y="501" font-size="11" fill="#9aa6b4">BLE + Wi-Fi, IMU water-detect</text>
    </g>
    <!-- Label: Coil -->
    <g>
      <line x1="900" y1="240" x2="900" y2="160" stroke="#ff7a2e" stroke-width="0.8"/>
      <circle cx="900" cy="240" r="3" fill="#ff7a2e"/>
      <text x="905" y="145" font-size="14" font-weight="600" fill="#ff7a2e">03 / INDUCTION COIL</text>
      <text x="905" y="162" font-size="11" fill="#9aa6b4">Ferrite-cored, 1.5 kW continuous</text>
      <text x="905" y="176" font-size="11" fill="#9aa6b4">— 96% transfer efficiency to water</text>
    </g>
    <!-- Label: Flow -->
    <g>
      <line x1="1170" y1="350" x2="1170" y2="430" stroke="#ffd28a" stroke-width="0.8"/>
      <circle cx="1170" cy="350" r="3" fill="#ffd28a"/>
      <text x="1175" y="450" font-size="14" font-weight="600" fill="#ffd28a">04 / FLOW MANIFOLD</text>
      <text x="1175" y="467" font-size="11" fill="#9aa6b4">Convective intake / vortex outlet</text>
      <text x="1175" y="481" font-size="11" fill="#9aa6b4">— moves 14 gal/min of warm water</text>
    </g>
  </g>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#5e6e80" letter-spacing="6">CROSS-SECTION · M1 MARINE THERMAL</text>
</svg>
