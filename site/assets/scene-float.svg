<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="poolSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb8e8"/>
      <stop offset="100%" stop-color="#a8dcf0"/>
    </linearGradient>
    <linearGradient id="poolWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e9bcc"/>
      <stop offset="50%" stop-color="#1e6fa0"/>
      <stop offset="100%" stop-color="#0e3c60"/>
    </linearGradient>
    <radialGradient id="poolWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb86b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ff7a2e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e6fa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floatPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb0c8"/>
      <stop offset="60%" stop-color="#ff7898"/>
      <stop offset="100%" stop-color="#c54068"/>
    </linearGradient>
    <linearGradient id="dBody2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e6e80"/>
      <stop offset="50%" stop-color="#1d2530"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="dHeat2" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="50%" stop-color="#ff7a2e"/>
      <stop offset="100%" stop-color="#9c2c00"/>
    </radialGradient>
    <pattern id="caustics" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 20 30 Q 40 10 60 35 T 100 40 T 140 30 T 180 35" stroke="#a8dcf0" stroke-width="0.6" fill="none" opacity="0.5"/>
      <path d="M 10 90 Q 50 70 90 95 T 170 90" stroke="#a8dcf0" stroke-width="0.5" fill="none" opacity="0.4"/>
      <path d="M 30 150 Q 70 130 110 155 T 190 150" stroke="#a8dcf0" stroke-width="0.6" fill="none" opacity="0.45"/>
    </pattern>
    <filter id="splash"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="poolBlur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- Sky strip top -->
  <rect width="1600" height="160" fill="url(#poolSky)"/>
  <!-- Pool deck (concrete/travertine) -->
  <rect y="120" width="1600" height="120" fill="#e8dfca"/>
  <g opacity="0.5">
    <line x1="0" y1="170" x2="1600" y2="170" stroke="#a89878" stroke-width="0.6"/>
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#a89878" stroke-width="0.6"/>
  </g>
  <!-- Lounge chairs in distance -->
  <g transform="translate(120,150)" opacity="0.85">
    <rect x="0" y="0" width="80" height="6" fill="#fff" rx="2"/>
    <rect x="0" y="-4" width="80" height="6" fill="#1a2840" rx="2"/>
  </g>
  <g transform="translate(1380,150)" opacity="0.85">
    <rect x="0" y="0" width="80" height="6" fill="#fff" rx="2"/>
    <rect x="0" y="-4" width="80" height="6" fill="#c54068" rx="2"/>
  </g>
  <!-- Palm leaves -->
  <g transform="translate(40,30)" opacity="0.8">
    <path d="M 0 100 Q -30 60 -80 40 Q -50 60 -20 100 Z" fill="#2a5a3a"/>
    <path d="M 0 100 Q 30 50 90 30 Q 50 70 20 100 Z" fill="#3a7a4a"/>
    <path d="M 0 100 Q -10 50 -20 0 Q 0 60 10 100 Z" fill="#2a5a3a"/>
  </g>
  <g transform="translate(1560,40)" opacity="0.8">
    <path d="M 0 90 Q 30 50 80 30 Q 50 60 20 90 Z" fill="#2a5a3a"/>
    <path d="M 0 90 Q -30 50 -90 30 Q -50 60 -20 90 Z" fill="#3a7a4a"/>
  </g>

  <!-- Pool edge -->
  <rect x="0" y="220" width="1600" height="20" fill="#a89878"/>
  <rect x="0" y="240" width="1600" height="6" fill="#5a4a30" opacity="0.4"/>

  <!-- Pool water -->
  <rect y="246" width="1600" height="654" fill="url(#poolWater)"/>
  <!-- Caustics overlay -->
  <rect y="246" width="1600" height="654" fill="url(#caustics)" opacity="0.7"/>

  <!-- Warm water glow around device -->
  <ellipse cx="900" cy="600" rx="700" ry="260" fill="url(#poolWarm)" filter="url(#poolBlur)"/>

  <!-- Ripple rings -->
  <g stroke="#ffb86b" fill="none" opacity="0.55" stroke-width="1.8">
    <ellipse cx="900" cy="600" rx="160" ry="40"/>
    <ellipse cx="900" cy="600" rx="300" ry="80" opacity="0.4"/>
    <ellipse cx="900" cy="600" rx="470" ry="130" opacity="0.25"/>
    <ellipse cx="900" cy="600" rx="640" ry="180" opacity="0.13"/>
  </g>

  <!-- Pink flamingo pool float (large, foreground left) -->
  <g transform="translate(420,560)">
    <!-- Reflection -->
    <g opacity="0.3" transform="scale(1,-1) translate(0,40)">
      <ellipse cx="0" cy="0" rx="200" ry="55" fill="url(#floatPink)"/>
    </g>
    <!-- Body ring -->
    <ellipse cx="0" cy="0" rx="200" ry="55" fill="url(#floatPink)"/>
    <ellipse cx="0" cy="-3" rx="160" ry="35" fill="#1e6fa0"/>
    <ellipse cx="0" cy="-3" rx="160" ry="35" fill="url(#caustics)" opacity="0.4"/>
    <!-- Flamingo neck -->
    <path d="M -30 -10 Q -80 -90 -130 -90 Q -150 -85 -148 -70 Q -140 -50 -135 -40 L -120 -30 L -100 -20 L -60 -10 Z" fill="url(#floatPink)"/>
    <!-- Flamingo head -->
    <ellipse cx="-140" cy="-90" rx="22" ry="16" fill="url(#floatPink)"/>
    <path d="M -158 -88 L -178 -82 L -158 -78 Z" fill="#1a2840"/>
    <circle cx="-148" cy="-92" r="1.5" fill="#1a1410"/>
    <!-- Tail -->
    <path d="M 180 -20 Q 220 -40 240 -10 L 210 0 Z" fill="url(#floatPink)"/>
    <!-- Highlights -->
    <ellipse cx="-20" cy="-25" rx="120" ry="8" fill="#ffd0e0" opacity="0.6"/>

    <!-- Person lounging in float -->
    <g>
      <!-- legs -->
      <ellipse cx="120" cy="-5" rx="40" ry="8" fill="#e8c8a0"/>
      <!-- torso -->
      <ellipse cx="40" cy="-12" rx="34" ry="14" fill="#1a2840"/>
      <!-- arms outstretched -->
      <ellipse cx="-20" cy="-5" rx="20" ry="6" fill="#e8c8a0"/>
      <!-- head -->
      <circle cx="-10" cy="-25" r="14" fill="#d8a878"/>
      <path d="M -22 -32 Q -10 -42 4 -34 Q 0 -28 -10 -28 Q -20 -28 -22 -32 Z" fill="#3a2a1a"/>
      <!-- sunglasses -->
      <rect x="-18" y="-26" width="16" height="4" rx="1" fill="#0a0f15"/>
      <!-- drink -->
      <rect x="50" y="-30" width="2" height="10" fill="#3a4654"/>
      <ellipse cx="51" cy="-34" rx="5" ry="3" fill="#ffd28a" opacity="0.9"/>
    </g>
  </g>

  <!-- ===== DEVICE floating tethered next to float ===== -->
  <g transform="translate(820,605)">
    <!-- Tether rope to float -->
    <path d="M 0 -10 Q -100 -30 -200 -40" stroke="#e8dfca" stroke-width="1.5" fill="none" opacity="0.85"/>
    <path d="M 0 -10 Q -100 -30 -200 -40" stroke="#a89878" stroke-width="0.5" fill="none" opacity="0.6"/>

    <!-- Submerged ambient glow under device -->
    <ellipse cx="80" cy="20" rx="180" ry="40" fill="#ff7a2e" opacity="0.45" filter="url(#poolBlur)"/>

    <!-- Device body horizontal, water line through middle -->
    <g>
      <!-- Rear cap -->
      <ellipse cx="-100" cy="0" rx="9" ry="28" fill="#0a0f15"/>
      <!-- body -->
      <rect x="-100" y="-28" width="240" height="56" fill="url(#dBody2)"/>
      <!-- top highlight (above water = brighter) -->
      <rect x="-100" y="-28" width="240" height="22" fill="#7d8b9b" opacity="0.5"/>
      <!-- bottom (in water = darker, blue tint) -->
      <rect x="-100" y="0" width="240" height="28" fill="#1a2840" opacity="0.45"/>
      <!-- nose -->
      <path d="M 140 -28 Q 175 -28 195 0 Q 175 28 140 28 Z" fill="url(#dBody2)"/>
      <!-- screen -->
      <rect x="-10" y="-16" width="55" height="22" rx="3" fill="#0a0f15"/>
      <text x="17" y="-1" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#9cf0ff">98°</text>
      <text x="17" y="6" text-anchor="middle" font-family="monospace" font-size="3" fill="#5ec8e0">POOL MODE</text>
      <!-- branding -->
      <text x="-70" y="14" font-family="sans-serif" font-size="3.5" fill="#5e6e80" letter-spacing="2">AQUAEMBER</text>
      <!-- vent slits front -->
      <rect x="170" y="-20" width="6" height="40" rx="1" fill="#0a0f15"/>
      <rect x="171" y="-16" width="4" height="2.5" fill="url(#dHeat2)"/>
      <rect x="171" y="-10" width="4" height="2.5" fill="url(#dHeat2)"/>
      <rect x="171" y="-4" width="4" height="2.5" fill="url(#dHeat2)"/>
      <rect x="171" y="2" width="4" height="2.5" fill="url(#dHeat2)"/>
      <rect x="171" y="8" width="4" height="2.5" fill="url(#dHeat2)"/>
      <rect x="171" y="14" width="4" height="2.5" fill="url(#dHeat2)"/>
    </g>

    <!-- Water line splashing around device -->
    <g opacity="0.9">
      <path d="M -110 0 Q -90 -4 -70 0 T -30 0 T 10 0 T 50 0 T 90 0 T 130 0 T 170 0" stroke="#cfe8f7" stroke-width="1" fill="none"/>
      <path d="M -110 2 Q -90 -2 -70 2 T -30 2 T 10 2 T 50 2 T 90 2 T 130 2 T 170 2" stroke="#a8dcf0" stroke-width="0.6" fill="none"/>
    </g>

    <!-- Small steam wisp -->
    <g opacity="0.55" filter="url(#splash)">
      <ellipse cx="160" cy="-50" rx="14" ry="22" fill="#fff"/>
      <ellipse cx="150" cy="-30" rx="10" ry="15" fill="#fff"/>
    </g>

    <!-- LED status ring on rear -->
    <circle cx="-100" cy="0" r="3" fill="#5ee0ff"/>
  </g>

  <!-- Foreground splash droplets -->
  <g opacity="0.85">
    <circle cx="700" cy="640" r="2" fill="#fff"/>
    <circle cx="950" cy="660" r="2.5" fill="#fff"/>
    <circle cx="1100" cy="630" r="1.8" fill="#fff"/>
    <circle cx="1300" cy="700" r="2.2" fill="#fff"/>
  </g>

  <radialGradient id="vignette2" cx="0.5" cy="0.5" r="0.95">
    <stop offset="65%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette2)"/>
</svg>
